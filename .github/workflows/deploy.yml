name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # pnpm build runs content:validate and copy:check first — see package.json.
      - run: pnpm build
      - run: pnpm test:safety
      - run: pnpm test:a11y
      - run: pnpm bundle:check
      # DESIGN.md §17's new checks. contrast:check (build order step 5),
      # map:check (step 4), and strings:check are real and now pass, so
      # they block deploy like the checks above. tokens:check and
      # offline:check still fail against genuine, pre-existing gaps outside
      # those steps' scope (see CLAUDE.md's Commands section for what each
      # reports); continue-on-error keeps them visible without blocking
      # deploy — each moves up here once its corresponding build-order step
      # lands (tokens:check at step 7, offline:check at step 9).
      - run: pnpm contrast:check
      - run: pnpm map:check
      - run: pnpm strings:check
      - run: pnpm tokens:check
        continue-on-error: true
      - run: pnpm offline:check
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
