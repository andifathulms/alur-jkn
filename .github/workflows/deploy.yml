name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # offline:check (below) drives a real Chromium instance against the
      # production build — DESIGN.md §18's service worker, build order
      # step 9. --with-deps installs the OS libraries Chromium needs on
      # the runner image; --only-shell would be smaller but next-pwa's
      # smoke test needs full page rendering, not just the headless shell.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm lint
      # pnpm build runs content:validate and copy:check first — see package.json.
      - run: pnpm build
      - run: pnpm test:safety
      - run: pnpm test:a11y
      - run: pnpm bundle:check
      # DESIGN.md §17's new checks — all five are real and now pass, so
      # they block deploy like the checks above.
      - run: pnpm contrast:check
      - run: pnpm map:check
      - run: pnpm strings:check
      - run: pnpm tokens:check
      - run: pnpm offline:check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
